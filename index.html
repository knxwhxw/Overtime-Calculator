<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4our (포아워)</title>
    <!-- Adobe Fonts (Typekit) Mina & Google Fonts Noto Sans KR -->
    <link rel="stylesheet" href="https://use.typekit.net/wst5cyn.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #160f23;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px 12px;
        }

        /* 가로 너비 축소: max-width 480px -> 380px로 변경하여 웹 화면에서 핏감 개선 */
        .container {
            width: 100%;
            max-width: 380px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            border: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .brand-area {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 8px;
        }

        .brand-logo {
            font-family: "mina", mina, sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 34px;
            color: #e9d5ff;
            line-height: 1;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(216, 180, 254, 0.4);
        }

        .brand-sub {
            font-size: 13px;
            color: #c084fc;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background-color: rgba(192, 132, 252, 0.1);
            border: none;
            color: #d8b4fe;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .icon-btn:hover {
            background-color: rgba(192, 132, 252, 0.25);
            color: #ffffff;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Work Mode Toggle Switch */
        .mode-toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 18, 42, 0.6);
            border: 1px solid rgba(216, 180, 254, 0.15);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 14px;
        }

        .toggle-btn-group {
            display: flex;
            width: 100%;
            background: rgba(15, 10, 26, 0.5);
            border-radius: 10px;
            padding: 3px;
            gap: 4px;
        }

        .toggle-option {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 700;
            color: #c084fc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .toggle-option.active {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        /* Target OT Card (희망초과시간) */
        .target-ot-card {
            background: rgba(26, 18, 42, 0.65);
            border: 1px solid rgba(216, 180, 254, 0.15);
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .target-left-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .preset-btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .preset-btn {
            background: rgba(192, 132, 252, 0.1);
            border: none;
            color: #e9d5ff;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 7px 0;
        }

        .preset-btn:active, .preset-btn:hover {
            background: rgba(192, 132, 252, 0.3);
            color: #ffffff;
        }

        .target-right-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 135px;
        }

        .target-ot-label {
            font-size: 12px;
            color: #d8b4fe;
            font-weight: 700;
            text-align: center;
        }

        .dial-container, .dial-container-tall {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            width: 100%;
        }

        .dial-container-tall {
            justify-content: center;
        }

        .dial-select-btn {
            background: #140d21;
            border: none;
            border-radius: 8px;
            color: #f3e8ff;
            font-size: 16px;
            font-weight: 800;
            outline: none;
            cursor: pointer;
            text-align-last: center;
            padding: 7px 0;
            flex: 1;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
        }

        .dial-container-tall .dial-select-btn {
            font-size: 16px;
            padding: 7px 0;
        }

        .dial-select-btn:focus, .dial-select-btn:active {
            background: #231638;
            color: #ffffff;
        }

        .dial-select-btn option {
            background-color: #140d21;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 8px;
            border: none;
        }

        .dial-colon {
            font-size: 15px;
            font-weight: 800;
            color: #c084fc;
            margin: 0 1px;
        }

        /* Results Panel */
        .results-panel {
            background: linear-gradient(145deg, rgba(58, 41, 88, 0.65), rgba(38, 25, 60, 0.85));
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 20px;
            padding: 16px 12px 12px 12px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .main-results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            margin-bottom: 8px;
        }

        .result-box {
            text-align: center;
            padding: 0 4px;
        }

        .result-box:first-child {
            border-right: 1px solid rgba(216, 180, 254, 0.15);
        }

        .main-result-label {
            font-size: 12px;
            color: #d8b4fe;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .main-result-value {
            font-size: 26px;
            font-weight: 800;
            color: #f3e8ff;
            text-shadow: 0 0 12px rgba(216, 180, 254, 0.4);
        }

        .main-result-value.accent {
            color: #e879f9;
            text-shadow: 0 0 12px rgba(232, 121, 249, 0.4);
        }

        .sub-result-divider {
            width: 90%;
            height: 1px;
            background-color: rgba(216, 180, 254, 0.15);
            margin-bottom: 8px;
        }

        .sub-result-row {
            display: flex;
            justify-content: space-between;
            width: 90%;
            font-size: 11px;
            color: rgba(216, 180, 254, 0.6);
        }

        .sub-result-value {
            font-size: 12px;
            font-weight: 600;
            color: #c084fc;
        }

        /* Inputs Panel */
        .inputs-panel {
            background: rgba(26, 18, 42, 0.5);
            border: 1px solid rgba(216, 180, 254, 0.15);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-label {
            font-size: 12px;
            color: #d8b4fe;
            font-weight: 600;
            padding-left: 2px;
        }

        .footer-credit {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(216, 180, 254, 0.4);
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-area">
            <span class="brand-logo">4our</span>
            <span class="brand-sub">포아워</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="resetDefaults()" title="새로고침">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="icon-btn" onclick="clearAll()" title="전체 지우기">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Work Mode Toggle Switch -->
    <div class="mode-toggle-container">
        <div class="toggle-btn-group">
            <div id="mode18" class="toggle-option active" onclick="setWorkMode('18')">18시 퇴근자</div>
            <div id="mode17" class="toggle-option" onclick="setWorkMode('17')">17시 퇴근자</div>
        </div>
    </div>

    <!-- Target OT Card -->
    <div class="target-ot-card">
        <div class="target-left-col">
            <div class="preset-btn-grid">
                <button class="preset-btn" onclick="setPresetOt('01:00')">1h</button>
                <button class="preset-btn" onclick="setPresetOt('02:00')">2h</button>
                <button class="preset-btn" onclick="setPresetOt('03:00')">3h</button>
                <button class="preset-btn" onclick="setPresetOt('04:00')">4h</button>
                <button class="preset-btn" onclick="setPresetOt('05:00')">5h</button>
                <button class="preset-btn" onclick="setPresetOt('06:00')">6h</button>
            </div>
        </div>
        <div class="target-right-col">
            <span class="target-ot-label">희망 초과 시간</span>
            <div class="dial-container-tall">
                <select id="desiredOt_h1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                <select id="desiredOt_h2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                <span class="dial-colon">:</span>
                <select id="desiredOt_m1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                <select id="desiredOt_m2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
            </div>
        </div>
    </div>

    <!-- Results Panel -->
    <div class="results-panel">
        <div class="main-results-grid">
            <div class="result-box">
                <div class="main-result-label">희망 초과 달성</div>
                <div class="main-result-value" id="targetLeave">--:--</div>
            </div>
            <div class="result-box">
                <div class="main-result-label">인정 초과시간</div>
                <div class="main-result-value accent" id="actualOt">00:00</div>
            </div>
        </div>
        
        <div class="sub-result-divider"></div>
        
        <div class="sub-result-row">
            <div class="sub-result-item">
                <span>4our 달성:</span>
                <span class="sub-result-value" id="maxLeave">--:--</span>
            </div>
            <div class="sub-result-item">
                <span>아침 인정:</span>
                <span class="sub-result-value" id="morningOtVal">00:00</span>
            </div>
        </div>
    </div>

    <!-- Inputs Panel -->
    <div class="inputs-panel">
        <!-- 출근시간 - 퇴근시간 -->
        <div class="input-row">
            <div class="input-group">
                <label class="input-label">출근 시간</label>
                <div class="dial-container">
                    <select id="clockIn_h1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="clockIn_h2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <span class="dial-colon">:</span>
                    <select id="clockIn_m1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="clockIn_m2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">퇴근 시간</label>
                <div class="dial-container">
                    <select id="clockOut_h1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="clockOut_h2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <span class="dial-colon">:</span>
                    <select id="clockOut_m1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="clockOut_m2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                </div>
            </div>
        </div>

        <!-- 제외시작 - 제외종료 -->
        <div class="input-row">
            <div class="input-group">
                <label class="input-label">제외 시작</label>
                <div class="dial-container">
                    <select id="exStart_h1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="exStart_h2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <span class="dial-colon">:</span>
                    <select id="exStart_m1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="exStart_m2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">제외 종료</label>
                <div class="dial-container">
                    <select id="exEnd_h1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="exEnd_h2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <span class="dial-colon">:</span>
                    <select id="exEnd_m1" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                    <select id="exEnd_m2" class="dial-select-btn" onchange="updateInputState(); calculate();"></select>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer-credit">
    Created by knxwhxw
</footer>

<script>
    let currentMode = '18';

    const modeData = {
        '18': {
            clockIn: '07:00',
            clockOut: '21:00',
            exStart: '19:00',
            exEnd: '19:00',
            desiredOt: '04:00'
        },
        '17': {
            clockIn: '07:00',
            clockOut: '20:00',
            exStart: '18:00',
            exEnd: '18:00',
            desiredOt: '04:00'
        }
    };

    function populateDialOptions(selectId, max) {
        const select = document.getElementById(selectId);
        select.innerHTML = '';
        for (let i = 0; i < max; i++) {
            const val = String(i);
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
        }
    }

    function initDials() {
        const fields = ['clockIn', 'clockOut', 'exStart', 'exEnd', 'desiredOt'];
        fields.forEach(field => {
            populateDialOptions(field + '_h1', 3);  // 시간 십의자리 (0~2)
            populateDialOptions(field + '_h2', 10); // 시간 일의자리 (0~9)
            populateDialOptions(field + '_m1', 6);  // 분 십의자리 (0~5)
            populateDialOptions(field + '_m2', 10); // 분 일의자리 (0~9)
        });
    }

    function setDialValue(prefix, timeStr) {
        if (!timeStr || !timeStr.includes(':')) return;
        const [h, m] = timeStr.split(':');
        const hPadded = h.padStart(2, '0');
        const mPadded = m.padStart(2, '0');

        const h1Select = document.getElementById(prefix + '_h1');
        const h2Select = document.getElementById(prefix + '_h2');
        const m1Select = document.getElementById(prefix + '_m1');
        const m2Select = document.getElementById(prefix + '_m2');

        if (h1Select) h1Select.value = hPadded[0];
        if (h2Select) h2Select.value = hPadded[1];
        if (m1Select) m1Select.value = mPadded[0];
        if (m2Select) m2Select.value = mPadded[1];
    }

    function getDialValue(prefix) {
        const h1Select = document.getElementById(prefix + '_h1');
        const h2Select = document.getElementById(prefix + '_h2');
        const m1Select = document.getElementById(prefix + '_m1');
        const m2Select = document.getElementById(prefix + '_m2');
        
        if (!h1Select || !h2Select || !m1Select || !m2Select) return '00:00';
        return `${h1Select.value}${h2Select.value}:${m1Select.value}${m2Select.value}`;
    }

    function setPresetOt(timeStr) {
        setDialValue('desiredOt', timeStr);
        updateInputState();
        calculate();
    }

    function saveCurrentInputs() {
        modeData[currentMode] = {
            clockIn: getDialValue('clockIn'),
            clockOut: getDialValue('clockOut'),
            exStart: getDialValue('exStart'),
            exEnd: getDialValue('exEnd'),
            desiredOt: getDialValue('desiredOt')
        };
    }

    function loadInputs(mode) {
        const data = modeData[mode];
        setDialValue('clockIn', data.clockIn);
        setDialValue('clockOut', data.clockOut);
        setDialValue('exStart', data.exStart);
        setDialValue('exEnd', data.exEnd);
        setDialValue('desiredOt', data.desiredOt);
    }

    function updateInputState() {
        saveCurrentInputs();
    }

    function setWorkMode(mode) {
        if (currentMode === mode) return;
        
        saveCurrentInputs();
        currentMode = mode;

        if (mode === '18') {
            document.getElementById('mode18').classList.add('active');
            document.getElementById('mode17').classList.remove('active');
        } else {
            document.getElementById('mode17').classList.add('active');
            document.getElementById('mode18').classList.remove('active');
        }

        loadInputs(mode);
        calculate();
    }

    function parseMinutes(timeStr) {
        if (!timeStr || !timeStr.includes(':')) return null;
        const parts = timeStr.split(':');
        const h = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        if (isNaN(h) || isNaN(m)) return null;
        return h * 60 + m;
    }

    function formatTime(totalMins) {
        if (totalMins === null || isNaN(totalMins)) return "--:--";
        let mins = (totalMins % 1440 + 1440) % 1440;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function getOverlap(start1, end1, start2, end2) {
        const s = Math.max(start1, start2);
        const e = Math.min(end1, end2);
        return Math.max(0, e - s);
    }

    function calculate() {
        const inMins = parseMinutes(getDialValue('clockIn'));
        const outMins = parseMinutes(getDialValue('clockOut'));
        const exStartMins = parseMinutes(getDialValue('exStart'));
        const exEndMins = parseMinutes(getDialValue('exEnd'));
        const desiredMins = parseMinutes(getDialValue('desiredOt'));

        let customExStart = 0;
        let customExEnd = 0;
        if (exStartMins !== null && exEndMins !== null && exEndMins > exStartMins) {
            customExStart = exStartMins;
            customExEnd = exEndMins;
        }

        if (inMins !== null) {
            let morningOtLimitStart = 0;
            let eveningOtStart = 0;

            if (currentMode === '18') {
                if (inMins < 480) {
                    morningOtLimitStart = 480; // 08:00
                    eveningOtStart = 1080;     // 18:00
                } else {
                    morningOtLimitStart = 0;   
                    eveningOtStart = 1140;     // 19:00
                }
            } else {
                if (inMins < 480) {
                    morningOtLimitStart = 480; // 08:00
                    eveningOtStart = 1020;     // 17:00
                } else {
                    morningOtLimitStart = 0;   
                    eveningOtStart = 1080;     // 18:00
                }
            }

            let morningOt = 0;
            if (inMins < morningOtLimitStart) {
                morningOt = morningOtLimitStart - inMins;
            }

            document.getElementById('morningOtVal').innerText = formatTime(morningOt);

            // 1. 희망 초과 달성 시각
            if (desiredMins !== null) {
                const neededEveningOt = Math.max(0, desiredMins - morningOt);
                let targetLeaveMins = eveningOtStart + neededEveningOt;

                if (customExEnd > customExStart) {
                    const customExInEvening = Math.max(0, customExEnd - Math.max(customExStart, eveningOtStart));
                    targetLeaveMins += customExInEvening;
                }

                document.getElementById('targetLeave').innerText = formatTime(targetLeaveMins);
            } else {
                document.getElementById('targetLeave').innerText = "--:--";
            }

            // 2. 실제 인정 초과시간
            if (outMins !== null && outMins > inMins) {
                let eveningOt = Math.max(0, outMins - eveningOtStart);
                let totalOt = morningOt + eveningOt;

                if (customExEnd > customExStart) {
                    const exInMorning = inMins < morningOtLimitStart ? getOverlap(customExStart, customExEnd, inMins, morningOtLimitStart) : 0;
                    const exInEvening = getOverlap(customExStart, customExEnd, eveningOtStart, outMins);
                    totalOt = Math.max(0, totalOt - (exInMorning + exInEvening));
                }

                document.getElementById('actualOt').innerText = formatTime(Math.max(0, totalOt));
            } else {
                document.getElementById('actualOt').innerText = "00:00";
            }

            // 3. 4our 달성 시각 (서브)
            const neededEvening4h = Math.max(0, 240 - morningOt);
            let maxLeaveMins = eveningOtStart + neededEvening4h;

            if (customExEnd > customExStart) {
                const customExInEvening = Math.max(0, customExEnd - Math.max(customExStart, eveningOtStart));
                maxLeaveMins += customExInEvening;
            }

            document.getElementById('maxLeave').innerText = formatTime(maxLeaveMins);
        } else {
            document.getElementById('targetLeave').innerText = "--:--";
            document.getElementById('actualOt').innerText = "00:00";
            document.getElementById('maxLeave').innerText = "--:--";
            document.getElementById('morningOtVal').innerText = "00:00";
        }
    }

    function resetDefaults() {
        if (currentMode === '18') {
            modeData['18'] = { clockIn: "07:00", clockOut: "21:00", exStart: "19:00", exEnd: "19:00", desiredOt: "04:00" };
        } else {
            modeData['17'] = { clockIn: "07:00", clockOut: "20:00", exStart: "18:00", exEnd: "18:00", desiredOt: "04:00" };
        }
        loadInputs(currentMode);
        calculate();
    }

    function clearAll() {
        modeData[currentMode] = { clockIn: "00:00", clockOut: "00:00", exStart: "00:00", exEnd: "00:00", desiredOt: "00:00" };
        loadInputs(currentMode);
        document.getElementById('targetLeave').innerText = "--:--";
        document.getElementById('actualOt').innerText = "00:00";
        document.getElementById('maxLeave').innerText = "--:--";
        document.getElementById('morningOtVal').innerText = "00:00";
    }

    initDials();
    loadInputs(currentMode);
    calculate();
</script>
</body>
</html>
