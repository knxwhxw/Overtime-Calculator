<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4our (포아워)</title>
    <!-- Adobe Fonts (Typekit) Mina & Google Fonts Noto Sans KR -->
    <link rel="stylesheet" href="https://use.typekit.net/wst5cyn.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2a1b40 0%, #181124 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(36, 25, 56, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(181, 126, 255, 0.15);
            border: 1px solid rgba(216, 180, 254, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-area {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 10px;
        }

        .brand-logo {
            font-family: "mina", mina, sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 38px;
            color: #e9d5ff;
            line-height: 1;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(216, 180, 254, 0.4);
        }

        .brand-sub {
            font-size: 15px;
            color: #c084fc;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background-color: rgba(192, 132, 252, 0.12);
            border: 1px solid rgba(216, 180, 254, 0.2);
            color: #d8b4fe;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .icon-btn:hover {
            background-color: rgba(192, 132, 252, 0.3);
            color: #ffffff;
            transform: scale(1.05);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Work Mode Toggle Switch */
        .mode-toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 18, 42, 0.6);
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 16px;
            padding: 6px 8px;
            margin-bottom: 20px;
        }

        .toggle-btn-group {
            display: flex;
            width: 100%;
            background: rgba(15, 10, 26, 0.5);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .toggle-option {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            color: #c084fc;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .toggle-option.active {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        /* Results Panel */
        .results-panel {
            background: linear-gradient(145deg, rgba(58, 41, 88, 0.6), rgba(38, 25, 60, 0.8));
            border: 1px solid rgba(216, 180, 254, 0.25);
            border-radius: 20px;
            padding: 22px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            margin-bottom: 24px;
            position: relative;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .result-item {
            text-align: center;
            position: relative;
        }

        .result-item:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: rgba(216, 180, 254, 0.15);
        }

        .result-label {
            font-size: 12px;
            color: #c084fc;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
        }

        .result-value.purple-light { color: #f3e8ff; }
        .result-value.lavender { color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }
        .result-value.accent { color: #e879f9; text-shadow: 0 0 10px rgba(232, 121, 249, 0.3); }

        /* Inputs Panel */
        .inputs-panel {
            background: rgba(26, 18, 42, 0.5);
            border: 1px solid rgba(216, 180, 254, 0.15);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .input-row.full {
            grid-template-columns: 1fr;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 13px;
            color: #d8b4fe;
            font-weight: 500;
            padding-left: 2px;
        }

        .time-input {
            width: 100%;
            background-color: rgba(15, 10, 26, 0.6);
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            outline: none;
            transition: all 0.2s ease;
        }

        .time-input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
            background-color: rgba(15, 10, 26, 0.85);
        }

        .footer-credit {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(216, 180, 254, 0.5);
            text-align: center;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }
            .results-panel {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 20px;
            }
            .result-item:not(:last-child)::after {
                display: none;
            }
            .result-value {
                font-size: 26px;
            }
            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-area">
            <span class="brand-logo">4our</span>
            <span class="brand-sub">포아워</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="resetDefaults()" title="새로고침">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="icon-btn" onclick="clearAll()" title="전체 지우기">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-toggle-container">
        <div class="toggle-btn-group">
            <div id="mode18" class="toggle-option active" onclick="setWorkMode('18')">18시 퇴근자</div>
            <div id="mode17" class="toggle-option" onclick="setWorkMode('17')">17시 퇴근자</div>
        </div>
    </div>

    <!-- Results Panel -->
    <div class="results-panel">
        <div class="result-item">
            <div class="result-label">희망 초과 달성</div>
            <div class="result-value purple-light" id="targetLeave">--:--</div>
        </div>
        <div class="result-item">
            <div class="result-label">4our 달성</div>
            <div class="result-value lavender" id="maxLeave">--:--</div>
        </div>
        <div class="result-item">
            <div class="result-label">인정 초과시간</div>
            <div class="result-value accent" id="actualOt">00:00</div>
        </div>
    </div>

    <!-- Inputs Panel -->
    <div class="inputs-panel">
        <div class="input-row">
            <div class="input-group">
                <label class="input-label">출근 시간</label>
                <input type="text" id="clockIn" class="time-input" value="07:00" placeholder="HH:MM" oninput="updateInputState(); calculate();">
            </div>
            <div class="input-group">
                <label class="input-label">퇴근 시간</label>
                <input type="text" id="clockOut" class="time-input" value="21:00" placeholder="HH:MM" oninput="updateInputState(); calculate();">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label class="input-label">제외 시작</label>
                <input type="text" id="exStart" class="time-input" value="00:00" placeholder="HH:MM" oninput="updateInputState(); calculate();">
            </div>
            <div class="input-group">
                <label class="input-label">제외 종료</label>
                <input type="text" id="exEnd" class="time-input" value="00:00" placeholder="HH:MM" oninput="calculate()">
            </div>
        </div>

        <div class="input-row full">
            <div class="input-group">
                <label class="input-label">희망 초과 시간</label>
                <input type="text" id="desiredOt" class="time-input" value="04:00" placeholder="HH:MM" oninput="updateInputState(); calculate();">
            </div>
        </div>
    </div>
</div>

<footer class="footer-credit">
    Created by knxwhxw
</footer>

<script>
    let currentMode = '18';

    // 각 모드별 입력값 상태 독립 저장
    const modeData = {
        '18': {
            clockIn: '07:00',
            clockOut: '21:00',
            exStart: '00:00',
            exEnd: '00:00',
            desiredOt: '04:00'
        },
        '17': {
            clockIn: '07:00',
            clockOut: '20:00',
            exStart: '00:00',
            exEnd: '00:00',
            desiredOt: '04:00'
        }
    };

    function saveCurrentInputs() {
        modeData[currentMode] = {
            clockIn: document.getElementById('clockIn').value,
            clockOut: document.getElementById('clockOut').value,
            exStart: document.getElementById('exStart').value,
            exEnd: document.getElementById('exEnd').value,
            desiredOt: document.getElementById('desiredOt').value
        };
    }

    function loadInputs(mode) {
        const data = modeData[mode];
        document.getElementById('clockIn').value = data.clockIn;
        document.getElementById('clockOut').value = data.clockOut;
        document.getElementById('exStart').value = data.exStart;
        document.getElementById('exEnd').value = data.exEnd;
        document.getElementById('desiredOt').value = data.desiredOt;
    }

    function updateInputState() {
        saveCurrentInputs();
    }

    function setWorkMode(mode) {
        if (currentMode === mode) return;
        
        saveCurrentInputs();
        currentMode = mode;

        if (mode === '18') {
            document.getElementById('mode18').classList.add('active');
            document.getElementById('mode17').classList.remove('active');
        } else {
            document.getElementById('mode17').classList.add('active');
            document.getElementById('mode18').classList.remove('active');
        }

        loadInputs(mode);
        calculate();
    }

    function parseMinutes(timeStr) {
        if (!timeStr || !timeStr.includes(':')) return null;
        const parts = timeStr.split(':');
        const h = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        if (isNaN(h) || isNaN(m)) return null;
        return h * 60 + m;
    }

    function formatTime(totalMins) {
        if (totalMins === null || isNaN(totalMins)) return "--:--";
        let mins = (totalMins % 1440 + 1440) % 1440;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function getOverlap(start1, end1, start2, end2) {
        const s = Math.max(start1, start2);
        const e = Math.min(end1, end2);
        return Math.max(0, e - s);
    }

    function calculate() {
        const inMins = parseMinutes(document.getElementById('clockIn').value);
        const outMins = parseMinutes(document.getElementById('clockOut').value);
        const exStartMins = parseMinutes(document.getElementById('exStart').value);
        const exEndMins = parseMinutes(document.getElementById('exEnd').value);
        const desiredMins = parseMinutes(document.getElementById('desiredOt').value);

        let customExStart = 0;
        let customExEnd = 0;
        if (exStartMins !== null && exEndMins !== null && exEndMins > exStartMins) {
            customExStart = exStartMins;
            customExEnd = exEndMins;
        }

        if (inMins !== null) {
            let morningOtLimitStart = 0;
            let eveningOtStart = 0;

            if (currentMode === '18') {
                if (inMins < 480) {
                    morningOtLimitStart = 480;
                    eveningOtStart = 1080;
                } else {
                    morningOtLimitStart = 0;   
                    eveningOtStart = 1140;
                }
            } else {
                if (inMins < 480) {
                    morningOtLimitStart = 480;
                    eveningOtStart = 1020;
                } else {
                    morningOtLimitStart = 0;   
                    eveningOtStart = 1080;
                }
            }

            let morningOt = 0;
            if (inMins < morningOtLimitStart) {
                morningOt = morningOtLimitStart - inMins;
            }

            if (desiredMins !== null) {
                const neededEveningOt = Math.max(0, desiredMins - morningOt);
                let targetLeaveMins = eveningOtStart + neededEveningOt;

                if (customExEnd > customExStart) {
                    const customExInEvening = Math.max(0, customExEnd - Math.max(customExStart, eveningOtStart));
                    targetLeaveMins += customExInEvening;
                }

                document.getElementById('targetLeave').innerText = formatTime(targetLeaveMins);
            } else {
                document.getElementById('targetLeave').innerText = "--:--";
            }

            const neededEvening4h = Math.max(0, 240 - morningOt);
            let maxLeaveMins = eveningOtStart + neededEvening4h;

            if (customExEnd > customExStart) {
                const customExInEvening = Math.max(0, customExEnd - Math.max(customExStart, eveningOtStart));
                maxLeaveMins += customExInEvening;
            }

            document.getElementById('maxLeave').innerText = formatTime(maxLeaveMins);

            if (outMins !== null && outMins > inMins) {
                let eveningOt = Math.max(0, outMins - eveningOtStart);
                let totalOt = morningOt + eveningOt;

                if (customExEnd > customExStart) {
                    const exInMorning = inMins < morningOtLimitStart ? getOverlap(customExStart, customExEnd, inMins, morningOtLimitStart) : 0;
                    const exInEvening = getOverlap(customExStart, customExEnd, eveningOtStart, outMins);
                    totalOt = Math.max(0, totalOt - (exInMorning + exInEvening));
                }

                let netOtMins = Math.min(240, totalOt);
                document.getElementById('actualOt').innerText = formatTime(netOtMins);
            } else {
                document.getElementById('actualOt').innerText = "00:00";
            }
        } else {
            document.getElementById('targetLeave').innerText = "--:--";
            document.getElementById('maxLeave').innerText = "--:--";
            document.getElementById('actualOt').innerText = "00:00";
        }
    }

    function resetDefaults() {
        if (currentMode === '18') {
            modeData['18'] = { clockIn: "07:00", clockOut: "21:00", exStart: "00:00", exEnd: "00:00", desiredOt: "04:00" };
        } else {
            modeData['17'] = { clockIn: "07:00", clockOut: "20:00", exStart: "00:00", exEnd: "00:00", desiredOt: "04:00" };
        }
        loadInputs(currentMode);
        calculate();
    }

    function clearAll() {
        modeData[currentMode] = { clockIn: "", clockOut: "", exStart: "", exEnd: "", desiredOt: "" };
        loadInputs(currentMode);
        document.getElementById('targetLeave').innerText = "--:--";
        document.getElementById('maxLeave').innerText = "--:--";
        document.getElementById('actualOt').innerText = "00:00";
    }

    calculate();
</script>
</body>
</html>
