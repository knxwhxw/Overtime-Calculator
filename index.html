<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4our (포아워)</title>
    <!-- Adobe Fonts (Typekit) Mina & Google Fonts Noto Sans KR -->
    <link rel="stylesheet" href="https://use.typekit.net/wst5cyn.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            /* 아이콘 배경색인 라벤더/퍼플 톤 반영 */
            background: linear-gradient(135deg, #2a1b40 0%, #181124 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;    /* 요소들을 세로(위->아래) 방향으로 배치 */
            justify-content: center;   /* 세로 중앙 정렬 */
            align-items: center;       /* 가로 중앙 정렬 */
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(36, 25, 56, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(181, 126, 255, 0.15);
            border: 1px solid rgba(216, 180, 254, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .brand-area {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 10px;
        }

        .brand-logo {
            font-family: "mina", mina, sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 38px;
            color: #e9d5ff;
            line-height: 1;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(216, 180, 254, 0.4);
        }

        .brand-sub {
            font-size: 15px;
            color: #c084fc;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background-color: rgba(192, 132, 252, 0.12);
            border: 1px solid rgba(216, 180, 254, 0.2);
            color: #d8b4fe;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .icon-btn:hover {
            background-color: rgba(192, 132, 252, 0.3);
            color: #ffffff;
            transform: scale(1.05);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Card Panels */
        .results-panel {
            background: linear-gradient(145deg, rgba(58, 41, 88, 0.6), rgba(38, 25, 60, 0.8));
            border: 1px solid rgba(216, 180, 254, 0.25);
            border-radius: 20px;
            padding: 22px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            margin-bottom: 24px;
            position: relative;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .result-item {
            text-align: center;
            position: relative;
        }

        .result-item:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: rgba(216, 180, 254, 0.15);
        }

        .result-label {
            font-size: 12px;
            color: #c084fc;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
        }

        .result-value.purple-light { color: #f3e8ff; }
        .result-value.lavender { color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }
        .result-value.accent { color: #e879f9; text-shadow: 0 0 10px rgba(232, 121, 249, 0.3); }

        /* Inputs Section */
        .inputs-panel {
            background: rgba(26, 18, 42, 0.5);
            border: 1px solid rgba(216, 180, 254, 0.15);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .input-row.full {
            grid-template-columns: 1fr;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 13px;
            color: #d8b4fe;
            font-weight: 500;
            padding-left: 2px;
        }

        .time-input {
            width: 100%;
            background-color: rgba(15, 10, 26, 0.6);
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            outline: none;
            transition: all 0.2s ease;
        }

        .time-input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
            background-color: rgba(15, 10, 26, 0.85);
        }

        /* Footer Style */
        .footer-credit {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(216, 180, 254, 0.5);
            text-align: center;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }
            .results-panel {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 20px;
            }
            .result-item:not(:last-child)::after {
                display: none;
            }
            .result-value {
                font-size: 26px;
            }
            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-area">
            <span class="brand-logo">4our</span>
            <span class="brand-sub">포아워</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="resetDefaults()" title="새로고침">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="icon-btn" onclick="clearAll()" title="전체 지우기">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Results Panel -->
    <div class="results-panel">
        <div class="result-item">
            <div class="result-label">희망 초과 달성</div>
            <div class="result-value purple-light" id="targetLeave">--:--</div>
        </div>
        <div class="result-item">
            <div class="result-label">4our 달성</div>
            <div class="result-value lavender" id="maxLeave">--:--</div>
        </div>
        <div class="result-item">
            <div class="result-label">인정 초과시간</div>
            <div class="result-value accent" id="actualOt">0.0h</div>
        </div>
    </div>

    <!-- Inputs Panel -->
    <div class="inputs-panel">
        <div class="input-row">
            <div class="input-group">
                <label class="input-label">출근 시간</label>
                <input type="text" id="clockIn" class="time-input" value="07:00" placeholder="HH:MM" oninput="calculate()">
            </div>
            <div class="input-group">
                <label class="input-label">퇴근 시간</label>
                <input type="text" id="clockOut" class="time-input" value="21:00" placeholder="HH:MM" oninput="calculate()">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label class="input-label">제외 시작</label>
                <input type="text" id="exStart" class="time-input" value="00:00" placeholder="HH:MM" oninput="calculate()">
            </div>
            <div class="input-group">
                <label class="input-label">제외 종료</label>
                <input type="text" id="exEnd" class="time-input" value="00:00" placeholder="HH:MM" oninput="calculate()">
            </div>
        </div>

        <div class="input-row full">
            <div class="input-group">
                <label class="input-label">희망 초과 시간</label>
                <input type="text" id="desiredOt" class="time-input" value="04:00" placeholder="HH:MM" oninput="calculate()">
            </div>
        </div>
    </div>
</div>

<footer class="footer-credit">
    Created by knxwhxw
</footer>

<script>
    function parseMinutes(timeStr) {
        if (!timeStr || !timeStr.includes(':')) return null;
        const parts = timeStr.split(':');
        const h = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        if (isNaN(h) || isNaN(m)) return null;
        return h * 60 + m;
    }

    function formatTime(totalMins) {
        if (totalMins === null || isNaN(totalMins)) return "--:--";
        let mins = (totalMins % 1440 + 1440) % 1440;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function calculate() {
        const inMins = parseMinutes(document.getElementById('clockIn').value);
        const outMins = parseMinutes(document.getElementById('clockOut').value);
        const exStartMins = parseMinutes(document.getElementById('exStart').value);
        const exEndMins = parseMinutes(document.getElementById('exEnd').value);
        const desiredMins = parseMinutes(document.getElementById('desiredOt').value);

        let exDuration = 0;
        if (exStartMins !== null && exEndMins !== null && exEndMins > exStartMins) {
            exDuration = exEndMins - exStartMins;
        }

        if (inMins !== null && desiredMins !== null) {
            let targetLeaveMins = 0;
            if (inMins < 480) {
                const morningOt = 480 - inMins;
                const remainingNeeded = Math.max(0, desiredMins - morningOt);
                targetLeaveMins = 1080 + remainingNeeded + exDuration;
            } else {
                targetLeaveMins = 1140 + desiredMins + exDuration;
            }
            document.getElementById('targetLeave').innerText = formatTime(targetLeaveMins);
        } else {
            document.getElementById('targetLeave').innerText = "--:--";
        }

        if (inMins !== null) {
            let maxLeaveMins = 0;
            if (inMins < 480) {
                const morningOt = 480 - inMins;
                const remainingFor4h = Math.max(0, 240 - morningOt);
                maxLeaveMins = 1080 + remainingFor4h + exDuration;
            } else {
                maxLeaveMins = 1140 + 240 + exDuration;
            }
            document.getElementById('maxLeave').innerText = formatTime(maxLeaveMins);
        } else {
            document.getElementById('maxLeave').innerText = "--:--";
        }

        if (inMins !== null && outMins !== null && outMins > inMins) {
            let grossOt = 0;
            if (inMins < 480) {
                const morningOt = 480 - inMins;
                const eveningOt = Math.max(0, outMins - 1080);
                grossOt = morningOt + eveningOt;
            } else {
                grossOt = Math.max(0, outMins - 1140);
            }
            let netOtMins = Math.max(0, grossOt - exDuration);
            let netOtHours = Math.min(4.0, netOtMins / 60);
            document.getElementById('actualOt').innerText = netOtHours.toFixed(1) + "h";
        } else {
            document.getElementById('actualOt').innerText = "0.0h";
        }
    }

    function resetDefaults() {
        document.getElementById('clockIn').value = "07:00";
        document.getElementById('clockOut').value = "21:00";
        document.getElementById('exStart').value = "00:00";
        document.getElementById('exEnd').value = "00:00";
        document.getElementById('desiredOt').value = "04:00";
        calculate();
    }

    function clearAll() {
        document.getElementById('clockIn').value = "";
        document.getElementById('clockOut').value = "";
        document.getElementById('exStart').value = "";
        document.getElementById('exEnd').value = "";
        document.getElementById('desiredOt').value = "";
        document.getElementById('targetLeave').innerText = "--:--";
        document.getElementById('maxLeave').innerText = "--:--";
        document.getElementById('actualOt').innerText = "0.0h";
    }

    calculate();
</script>
</body>
</html>
